<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生命歷程線</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#2d3a2a;--sub:#6b7168;--line:#d9d9d4;--accent:#2d6e5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b18;--card:#222823;--ink:#e6eee1;--sub:#a3ab9f;--line:#3a443b;--accent:#3f8f7a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:16px 16px 40px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto}
#box{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.edit{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.edit label{font-size:15px;color:var(--sub);width:100%}
.hint{font-size:13px;color:var(--sub);margin:10px 2px 0}
.form{margin-top:28px}
.form label.l{display:block;color:var(--sub);margin:18px 0 8px;font-size:16px}
input[type=text],input[type=date]{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:52px}
.edit input{flex:1;min-width:0;width:auto}
button{font:inherit;font-size:16px;font-weight:700;padding:14px 22px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;min-height:48px}
button.ghost{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:400}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.row[hidden]{display:none}
.note{color:var(--sub);font-size:15px;margin:16px 0 0}
#reset{margin-top:36px}
@media print{body{background:#fff;padding:0}.edit,.hint,.form{display:none}#box{box-shadow:none}}
</style></head><body>
<div class="wrap">
<div id="box"><svg id="c" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div class="edit">
  <label for="txt">選取的事件內容</label>
  <input type="text" id="txt" placeholder="先在圖上點一下新增事件，再在這裡輸入" disabled>
  <button class="ghost" id="del" disabled>刪除此點</button>
</div>
<p class="hint">在圖上空白處點一下新增事件（越高越是高峰，越低越是低谷）；拖曳圓點可調整時間（左右）與高低（上下）。</p>

<div class="form">
  <label class="l" for="name">姓名(選填,會顯示在圖片上)</label>
  <input type="text" id="name" autocomplete="off">
  <label class="l" for="date">製作日期</label>
  <input type="date" id="date">
  <div class="row" id="dlrow">
    <button id="png">下載圖片 (PNG)</button>
    <button id="pdf">下載 PDF</button>
  </div>
  <p class="note" id="note">完成後,按上面的按鈕保存結果,再傳給你的諮詢師。也可以直接用手機截圖。</p>
  <button class="ghost" id="reset">重新開始</button>
</div>
</div>
<script>
const $=s=>document.querySelector(s), svg=$('#c'), FONT='Noto Sans TC,PingFang TC,Microsoft JhengHei,sans-serif';
let pts=[],sel=null,uid=1,W=1000,H=640,M=false,G={};
$('#date').value=new Date().toISOString().slice(0,10);
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const wrap=t=>{const L=[];for(let i=0;i<t.length;i+=7)L.push(t.slice(i,i+7));return L.slice(0,4)};
function geo(){
  M=$('#box').clientWidth<640;W=M?640:1000;H=M?860:640;
  const bx=M?8:26,bw=M?50:62,Y0=M?140:150,Y1=H-50;
  G={bx,bw,X0:bx+bw+57,X1:W-40,Y0,Y1,MID:(Y0+Y1)/2};
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
}
const px=p=>G.X0+p.nx*(G.X1-G.X0), py=p=>G.Y0+p.ny*(G.Y1-G.Y0);
function render(){
  const {bx,bw,X0,X1,Y0,Y1,MID}=G, ax=bx+bw/2, s=[...pts].sort((a,b)=>a.nx-b.nx);
  const d=$('#date').value.split('-'), nm=$('#name').value.trim();
  const sub=[nm?'姓名：'+esc(nm):'',d.length==3?`製作日期：${+d[1]}/${+d[2]}`:''].filter(Boolean).join('　');
  const T=(x,y,sz,t,extra='')=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${sz}" font-family="${FONT}" ${extra}>${t}</text>`;
  let h=`<rect id="bg" width="${W}" height="${H}" fill="#fff"/>`+
  T(W/2,M?52:62,M?30:38,'生命歷程線',`font-weight="700" fill="#4f7d2a"`)+
  T(W/2,M?82:92,15,sub,'fill="#777"')+
  `<rect x="${bx}" y="${Y0-10}" width="${bw}" height="${Y1-Y0+20}" rx="8" fill="none" stroke="#9db58a" stroke-width="2"/>`+
  T(ax,Y0+30,20,'高','fill="#555"')+T(ax,Y0+56,20,'峰','fill="#555"')+T(ax,Y0+82,22,'＋','fill="#555"')+
  T(ax,Y1-88,20,'低','fill="#555"')+T(ax,Y1-62,20,'谷','fill="#555"')+T(ax,Y1-34,22,'－','fill="#555"')+
  T(bx+bw+22,MID+6,17,'年齡','fill="#555"')+
  `<line x1="${X0-10}" y1="${MID}" x2="${X1+30}" y2="${MID}" stroke="#444" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>`;
  if(s.length>1)h+=`<polyline points="${s.map(p=>px(p)+','+py(p)).join(' ')}" fill="none" stroke="#222" stroke-width="1.8"/>`;
  const fs=M?20:18,lh=M?24:22;
  s.forEach((p,i)=>{
    const x=px(p),y=py(p),n=[s[i-1],s[i+1]].filter(Boolean);
    const above=n.length?y<=n.reduce((a,q)=>a+py(q),0)/n.length:y<MID;
    const L=wrap(p.text),y0=above?y-18-(L.length-1)*lh:y+32,tx=Math.min(Math.max(x,70),W-70);
    h+=`<g data-id="${p.id}" style="cursor:grab;touch-action:none"><circle cx="${x}" cy="${y}" r="26" fill="transparent"/><circle cx="${x}" cy="${y}" r="${p.id===sel?15:11}" fill="#222" ${p.id===sel?'stroke="#4f7d2a" stroke-width="4"':''}/>`+
    L.map((l,j)=>T(tx,y0+j*lh,fs,esc(l),'fill="#333" pointer-events="none"')).join('')+`</g>`;
  });
  svg.innerHTML=h;
  const p=pts.find(q=>q.id===sel);
  $('#txt').disabled=$('#del').disabled=!p;
  if(p&&document.activeElement!==$('#txt'))$('#txt').value=p.text;
  if(!p)$('#txt').value='';
}
function pos(e){const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const r=q.matrixTransform(svg.getScreenCTM().inverse());
  return{nx:Math.min(Math.max((r.x-G.X0)/(G.X1-G.X0),0),1),ny:Math.min(Math.max((r.y-G.Y0)/(G.Y1-G.Y0),0),1)}}
let drag=null,tap=null;
svg.addEventListener('pointerdown',e=>{
  const g=e.target.closest('g[data-id]');
  if(g){sel=+g.dataset.id;drag=sel;svg.setPointerCapture(e.pointerId);render();return}
  tap={x:e.clientX,y:e.clientY,t:Date.now()};
});
svg.addEventListener('pointermove',e=>{if(drag==null)return;const p=pos(e),o=pts.find(q=>q.id===drag);if(o){o.nx=p.nx;o.ny=p.ny;render()}});
svg.addEventListener('pointerup',e=>{
  if(drag!=null){drag=null;return}
  if(tap&&Math.abs(e.clientX-tap.x)<8&&Math.abs(e.clientY-tap.y)<8&&Date.now()-tap.t<600&&!e.target.closest('g[data-id]')){
    const p=pos(e),o={id:uid++,nx:p.nx,ny:p.ny,text:'新事件'};pts.push(o);sel=o.id;render();
    $('#txt').focus();$('#txt').select();
  }
  tap=null;
});
svg.addEventListener('pointercancel',()=>{drag=null;tap=null});
$('#txt').addEventListener('input',e=>{const p=pts.find(q=>q.id===sel);if(p){p.text=e.target.value;render()}});
$('#del').onclick=()=>{pts=pts.filter(q=>q.id!==sel);sel=null;render()};
$('#name').oninput=$('#date').oninput=render;
let rt=null;
$('#reset').onclick=function(){
  if(!pts.length&&!$('#name').value)return;
  if(this.dataset.arm){pts=[];sel=null;$('#name').value='';delete this.dataset.arm;this.textContent='重新開始';clearTimeout(rt);render();return}
  this.dataset.arm=1;this.textContent='再按一次確認清空';
  rt=setTimeout(()=>{delete this.dataset.arm;this.textContent='重新開始'},3000);
};
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{geo();render()},120)});

function toCanvas(type){
  sel=null;render();
  const src=new XMLSerializer().serializeToString(svg).replace('<svg ',`<svg width="${W}" height="${H}" `);
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=W*2;c.height=H*2;c.getContext('2d').drawImage(img,0,0,W*2,H*2);
      c.toBlob(b=>b?res({b,w:c.width,h:c.height}):rej(),type,.92)};
    img.onerror=rej;
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);
  });
}
function buildPDF(jpg,w,h){
  const pw=595,ph=Math.round(595*h/w),enc=new TextEncoder(),ch=[],off=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);ch.push(b);len+=b.length};
  const obj=(n,f)=>{off[n]=len;push(n+' 0 obj\n');f();push('\nendobj\n')};
  push('%PDF-1.4\n');
  obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>push('<</Type/Pages/Kids[3 0 R]/Count 1>>'));
  obj(3,()=>push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`));
  obj(4,()=>{push(`<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`);push(jpg);push('\nendstream')});
  const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  obj(5,()=>push(`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`));
  const x=len;let t='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)t+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  push(t+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
  return new Blob(ch,{type:'application/pdf'});
}
const DL={save:({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return Promise.resolve()}};
function say(t){$('#note').textContent=t}
async function save(kind){
  if(!DL)return;
  const nm=$('#name').value.trim(),base='生命歷程線'+(nm?'_'+nm:'');
  try{
    if(kind==='png'){const r=await toCanvas('image/png');await DL.save({filename:base+'.png',data:r.b})}
    else{const r=await toCanvas('image/jpeg');const jpg=new Uint8Array(await r.b.arrayBuffer());await DL.save({filename:base+'.pdf',data:buildPDF(jpg,r.w,r.h)})}
  }catch(err){if(!err||err.code!=='declined')say('無法下載，請直接用手機截圖，再傳給你的諮詢師。')}
}
$('#png').onclick=()=>save('png');
$('#pdf').onclick=()=>save('pdf');
geo();render();
</script></body></html>
